name: ML Training CI-CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "models/**"
      - "outputs/**"
      - "reports/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  train-and-update:
    name: Train Models and Update Results

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # TRAIN MODELS
      # ==========================================

      - name: Run ML training
        run: |
          python train_models.py


      # ==========================================
      # VERIFY GENERATED FILES
      # ==========================================

      - name: Verify generated artifacts
        run: |
          echo "================================="
          echo "MODELS"
          echo "================================="
          ls -lah models/

          echo ""
          echo "================================="
          echo "OUTPUTS"
          echo "================================="
          ls -lah outputs/

          echo ""
          echo "================================="
          echo "REPORTS"
          echo "================================="
          ls -lah reports/


      # ==========================================
      # CONFIGURE GIT
      # ==========================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ==========================================
      # COMMIT GENERATED RESULTS
      # ==========================================

      - name: Commit updated ML artifacts
        run: |

          git add -A models/ outputs/ reports/

          if git diff --cached --quiet; then

            echo "No generated artifacts changed."

          else

            echo "Generated artifacts changed."

            git commit -m "Update ML training artifacts [skip ci]"

            git push origin HEAD:main

          fi
